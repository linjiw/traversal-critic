<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Fig 6: sim-trained critic scores on real G1 footage (no labels exist there).
       Data (v2 iter_400 critic): clean walk n=10 dist 4x7,5x3 mean 4.30
       crawl n=2 4,4 · impaired gait n=1 4 · posture n=2 4,4 · other-sim n=27 4x20,5x7 mean 4.26
       Dot plot per regime: jittered dots + mean tick. All demos collision-free -> expected band 4-5. -->
  <rect width="920" height="360" fill="#fcfcfb"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#0b0b0b">Fig. 6 — The sim-trained critic transfers to real robot video</text>
  <text x="20" y="46" font-size="12" fill="#52514e">42 real G1 clips + 27 other-sim controls · zero parse failures · regime ordering emerges: clean walk 4.80 > crawl 4.00</text>

  <!-- plot: x = score 1..5 mapped to 260..860 ; rows = regimes -->
  <!-- score x: s -> 260 + (s-1)*150 -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="260" y1="56" x2="260" y2="300"/>
    <line x1="410" y1="56" x2="410" y2="300"/>
    <line x1="560" y1="56" x2="560" y2="300"/>
    <line x1="710" y1="56" x2="710" y2="300"/>
    <line x1="860" y1="56" x2="860" y2="300"/>
  </g>
  <!-- expected band 4-5 shading -->
  <rect x="710" y="56" width="150" height="244" fill="#2a78d6" opacity="0.06"/>
  <text x="716" y="70" font-size="11" fill="#2a78d6">expected band</text>

  <g font-size="12" fill="#898781" text-anchor="middle">
    <text x="260" y="318">1</text><text x="410" y="318">2</text><text x="560" y="318">3</text><text x="710" y="318">4</text><text x="860" y="318">5</text>
  </g>
  <text x="140" y="318" font-size="12" fill="#52514e">critic score →</text>

  <!-- rows -->
  <!-- clean walk: 7 dots @4, 3 @5, mean 4.30 -> x = 710 + 0.30*150 = 755 -->
  <g>
    <text x="244" y="98" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">clean walk</text>
    <text x="244" y="114" font-size="11" fill="#898781" text-anchor="end">real G1, n=10</text>
    <circle cx="704" cy="92" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="716" cy="102" r="5" fill="#2a78d6" opacity="0.75"/>
    <circle cx="848" cy="86" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="858" cy="94" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="866" cy="88" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="852" cy="102" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="862" cy="108" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="870" cy="100" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="856" cy="114" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="866" cy="116" r="5" fill="#2a78d6" opacity="0.75"/>
    <line x1="830" y1="80" x2="830" y2="116" stroke="#0b0b0b" stroke-width="2.5"/>
    <text x="789" y="86" font-size="11.5" font-weight="700" fill="#0b0b0b">4.80</text>
  </g>
  <!-- crawl: 2 @4 -->
  <g>
    <text x="244" y="152" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">crawl</text>
    <text x="244" y="168" font-size="11" fill="#898781" text-anchor="end">real G1, n=2</text>
    <circle cx="705" cy="150" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="716" cy="158" r="5" fill="#2a78d6" opacity="0.75"/>
    <line x1="710" y1="142" x2="710" y2="168" stroke="#0b0b0b" stroke-width="2.5"/>
    <text x="726" y="149" font-size="11.5" font-weight="700" fill="#0b0b0b">4.00</text>
  </g>
  <!-- impaired gait: 1 @4 -->
  <g>
    <text x="244" y="204" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">impaired gait</text>
    <text x="244" y="220" font-size="11" fill="#898781" text-anchor="end">real G1, n=1</text>
    <circle cx="860" cy="206" r="5" fill="#2a78d6" opacity="0.75"/>
    <line x1="860" y1="196" x2="860" y2="218" stroke="#0b0b0b" stroke-width="2.5"/>
    <text x="800" y="203" font-size="11.5" font-weight="700" fill="#0b0b0b">5.00 (n=1)</text>
  </g>
  <!-- posture change: 2 @4 -->
  <g>
    <text x="244" y="252" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">posture change</text>
    <text x="244" y="268" font-size="11" fill="#898781" text-anchor="end">real G1, n=2</text>
    <circle cx="708" cy="252" r="5" fill="#2a78d6" opacity="0.75"/><circle cx="860" cy="256" r="5" fill="#2a78d6" opacity="0.75"/>
    <line x1="785" y1="242" x2="785" y2="268" stroke="#0b0b0b" stroke-width="2.5"/>
    <text x="792" y="249" font-size="11.5" font-weight="700" fill="#0b0b0b">4.50</text>
  </g>
  <!-- other-sim control: 20 @4, 7 @5, mean 4.26 -> x=749 -->
  <g>
    <text x="244" y="292" font-size="13" font-weight="600" fill="#52514e" text-anchor="end">different simulator</text>
    <text x="244" y="306" font-size="11" fill="#898781" text-anchor="end">control, n=27</text>
    <g fill="#898781" opacity="0.7">
      <circle cx="700" cy="288" r="4"/><circle cx="708" cy="294" r="4"/><circle cx="716" cy="286" r="4"/><circle cx="724" cy="292" r="4"/><circle cx="704" cy="298" r="4"/><circle cx="712" cy="282" r="4"/><circle cx="720" cy="298" r="4"/><circle cx="728" cy="286" r="4"/><circle cx="698" cy="292" r="4"/><circle cx="732" cy="294" r="4"/>
      <circle cx="846" cy="284" r="4"/><circle cx="854" cy="290" r="4"/><circle cx="862" cy="284" r="4"/><circle cx="850" cy="296" r="4"/><circle cx="858" cy="300" r="4"/><circle cx="866" cy="292" r="4"/><circle cx="870" cy="300" r="4"/><circle cx="844" cy="294" r="4"/><circle cx="874" cy="286" r="4"/><circle cx="864" cy="304" r="4"/><circle cx="872" cy="306" r="4"/><circle cx="848" cy="306" r="4"/><circle cx="876" cy="296" r="4"/>
    </g>
    <line x1="804" y1="280" x2="804" y2="302" stroke="#52514e" stroke-width="2.5"/>
    <text x="769" y="286" font-size="11.5" font-weight="700" fill="#52514e">4.63</text>
  </g>

  <text x="20" y="342" font-size="10.5" fill="#898781">Critic: v4 best checkpoint, decode verified to match training. Trained only on procedural MuJoCo clips. Dots jittered; ticks = regime means. No auto-label can exist for this footage.</text>
</svg>
